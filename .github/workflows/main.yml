name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies (robust)
        # Work around intermittent npm "edgesOut" errors by upgrading npm, clearing cache, and reinstalling
        run: |
          echo "Current node version: $(node --version)"
          echo "Current npm version: $(npm --version || echo 'npm not found')"
          npm install -g npm@latest
          echo "Upgraded npm version: $(npm --version)"
          npm cache clean --force
          rm -rf node_modules package-lock.json || true
          npm install
          echo "Install exit: $?"
          ls -la
      
      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
